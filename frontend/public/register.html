<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINANCE — Cadastro</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="auth-page">
    <main>
      <div class="login-card">
        <div class="login-card__logo">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
          </svg>
          <h1 class="login-card__title">FINANCE</h1>
        </div>
        <p class="login-card__subtitle">Crie sua conta</p>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="name">Nome</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Seu nome"
              autocomplete="name"
              required
            />
            <span class="error-message" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
            />
            <span class="error-message" id="password-error"></span>
          </div>

          <button type="submit" class="btn-primary-custom" id="register-btn">
            Criar conta
          </button>
        </form>

        <p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: #64748b;">
          Já tem conta?
          <a href="/index.html" style="color: #1a2f6e; font-weight: 500;">Entrar</a>
        </p>
      </div>
    </main>

    <script type="module" src="js/register.js"></script>
  </body>
</html>
