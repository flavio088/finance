<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINANCE — Cadastro</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main>
      <div class="login-card">
        <h1 class="login-card__title">FINANCE</h1>
        <p class="login-card__subtitle">Crie sua conta</p>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="name">Nome</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Seu nome"
              autocomplete="name"
              required
            />
            <span class="error-message" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
            />
            <span class="error-message" id="password-error"></span>
          </div>

          <button type="submit" class="btn-primary-custom" id="register-btn">
            Criar conta
          </button>
        </form>

        <p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: #64748b;">
          Já tem conta?
          <a href="/index.html" style="color: #1a2f6e; font-weight: 500;">Entrar</a>
        </p>
      </div>
    </main>

    <script type="module" src="js/register.js"></script>
  </body>
</html>
