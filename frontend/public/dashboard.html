<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINANCE — Dashboard</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    
    <!-- Header mobile -->
    <header class="mobile-header">
      <span class="mobile-header__title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
          <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
          <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
        </svg>
        FINANCE
      </span>
      <button class="hamburger" id="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar__logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
          </svg>
          FINANCE
        </div>
        <nav class="sidebar__nav">
          <button
            class="sidebar__link sidebar__link--active"
            data-page="income"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5" />
              <path d="m5 12 7-7 7 7" />
            </svg>
            Entradas
          </button>
          <button class="sidebar__link" data-page="expense">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14" />
              <path d="m19 12-7 7-7-7" />
            </svg>
            Saídas
          </button>
          <button class="sidebar__link" data-page="history">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M12 7v5l4 2" />
            </svg>
            Histórico
          </button>
        </nav>
        <div class="sidebar__logout">
          <button class="sidebar__link" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="m16 17 5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            Sair
          </button>
        </div>
      </aside>

      <!-- Conteúdo principal -->
      <main class="main-content">
        <!-- Página: Entradas -->
        <section id="page-income">
          <div class="page-header">
            <h1 class="page-header__title">Nova Entrada</h1>
            <p class="page-header__subtitle">Registre um recebimento</p>
          </div>

          <div class="card">
            <form id="income-form" novalidate>
              <div class="transaction-form__grid">
                <div class="field-group">
                  <label for="income-amount">Valor (R$)</label>
                  <input
                    type="number"
                    id="income-amount"
                    placeholder="0,00"
                    min="0.01"
                    step="0.01"
                    required
                  />
                </div>

                <div class="field-group">
                  <label for="income-date">Data</label>
                  <input type="date" id="income-date" required />
                </div>

                <div class="field-group">
                  <label for="income-category">Categoria</label>
                  <select id="income-category">
                    <option value="outros">Outros</option>
                    <option value="salario">Salário</option>
                    <option value="lazer">Lazer</option>
                    <option value="transporte">Transporte</option>
                    <option value="alimentacao">Alimentação</option>
                    <option value="moradia">Moradia</option>
                    <option value="saude">Saúde</option>
                    <option value="educacao">Educação</option>
                  </select>
                </div>

                <div class="field-group transaction-form__full">
                  <label for="income-description">Descrição</label>
                  <input
                    type="text"
                    id="income-description"
                    placeholder="Ex: Salário, Freelance..."
                    required
                  />
                </div>
              </div>

              <div class="feedback-message" id="income-feedback"></div>

              <button type="submit" class="btn-submit" id="income-btn">
                Registrar entrada
              </button>
            </form>
          </div>
        </section>

        <!-- Página: Saídas-->
        <section id="page-expense" style="display: none">
          <div class="page-header">
            <h1 class="page-header__title">Nova Saída</h1>
            <p class="page-header__subtitle">Registre um gasto</p>
          </div>

          <div class="card">
            <form id="expense-form" novalidate>
              <div class="transaction-form__grid">
                <div class="field-group">
                  <label for="expense-amount">Valor (R$)</label>
                  <input
                    type="number"
                    id="expense-amount"
                    placeholder="0,00"
                    min="0.01"
                    step="0.01"
                    required
                  />
                </div>

                <div class="field-group">
                  <label for="expense-date">Data</label>
                  <input type="date" id="expense-date" required />
                </div>

                <div class="field-group">
                  <label for="expense-payment">Forma de pagamento</label>
                  <select id="expense-payment" required>
                    <option value="">Selecione...</option>
                    <option value="debit">Débito</option>
                    <option value="credit">Crédito</option>
                    <option value="pix">PIX</option>
                    <option value="cash">Dinheiro</option>
                  </select>
                </div>

                <div class="field-group">
                  <label for="expense-category">Categoria</label>
                  <select id="expense-category">
                    <option value="outros">Outros</option>
                    <option value="alimentacao">Alimentação</option>
                    <option value="moradia">Moradia</option>
                    <option value="transporte">Transporte</option>
                    <option value="lazer">Lazer</option>
                    <option value="saude">Saúde</option>
                    <option value="educacao">Educação</option>
                  </select>
                </div>

                <div class="field-group">
                  <label for="expense-description">Descrição</label>
                  <input
                    type="text"
                    id="expense-description"
                    placeholder="Ex: Supermercado, Conta de luz..."
                    required
                  />
                </div>
              </div>

              <div class="feedback-message" id="expense-feedback"></div>

              <button type="submit" class="btn-submit" id="expense-btn">
                Registrar saída
              </button>
            </form>
          </div>
        </section>

        <!-- Página: Histórico -->
        <section id="page-history" style="display: none">
          <div class="page-header">
            <h1 class="page-header__title">Histórico</h1>
            <p class="page-header__subtitle">Seus lançamentos</p>
          </div>

          <!-- Filtros -->
          <div class="card filters-card">
            <div class="filters-grid">
              <div class="field-group">
                <label for="filter-month">Período</label>
                <input type="month" id="filter-month" />
              </div>
              <div class="field-group">
                <label for="filter-type">Tipo</label>
                <select id="filter-type">
                  <option value="">Todos</option>
                  <option value="income">Entradas</option>
                  <option value="expense">Saídas</option>
                </select>
              </div>
              <div class="field-group">
                <label for="filter-payment">Pagamento</label>
                <select id="filter-payment">
                  <option value="">Todos</option>
                  <option value="debit">Débito</option>
                  <option value="credit">Crédito</option>
                  <option value="pix">PIX</option>
                  <option value="cash">Dinheiro</option>
                </select>
              </div>
              <div class="field-group">
                <label for="filter-category">Categoria</label>
                <select id="filter-category">
                  <option value="">Todas</option>
                  <option value="alimentacao">Alimentação</option>
                  <option value="moradia">Moradia</option>
                  <option value="transporte">Transporte</option>
                  <option value="lazer">Lazer</option>
                  <option value="saude">Saúde</option>
                  <option value="educacao">Educação</option>
                  <option value="salario">Salário</option>
                  <option value="outros">Outros</option>
                </select>
              </div>
              <div class="field-group">
                <label for="filter-q">Buscar</label>
                <input type="text" id="filter-q" placeholder="Descrição..." />
              </div>
              <div class="filters-actions">
                <button type="button" class="btn-submit btn-submit--filter" id="filter-apply">
                  Aplicar
                </button>
                <button type="button" class="btn-ghost" id="filter-clear">
                  Limpar
                </button>
              </div>
            </div>
          </div>

          <!-- Cards de resumo -->
          <div class="history-summary">
            <div class="summary-card summary-card--balance">
              <div class="summary-card__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="6" width="20" height="12" rx="2" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
              </div>
              <div class="summary-card__label">Saldo atual</div>
              <div class="summary-card__value" id="summary-balance">
                R$ 0,00
              </div>
            </div>
            <div class="summary-card summary-card--income">
              <div class="summary-card__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 19V5" />
                  <path d="m5 12 7-7 7 7" />
                </svg>
              </div>
              <div class="summary-card__label">Total de entradas</div>
              <div
                class="summary-card__value summary-card__value--positive"
                id="summary-income"
              >
                R$ 0,00
              </div>
            </div>
            <div class="summary-card summary-card--expense">
              <div class="summary-card__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 5v14" />
                  <path d="m19 12-7 7-7-7" />
                </svg>
              </div>
              <div class="summary-card__label">Total de saídas</div>
              <div
                class="summary-card__value summary-card__value--negative"
                id="summary-expense"
              >
                R$ 0,00
              </div>
            </div>
          </div>

          <!-- Tabela de transações -->
          <div class="card history-card">
            <div class="history-card__header">
              <h2 class="history-card__title">Lançamentos</h2>
              <button type="button" class="btn-ghost" id="export-csv">
                Exportar CSV
              </button>
            </div>
            <div id="history-content">
              <div class="empty-state">Carregando...</div>
            </div>
          </div>

          <!-- Gráficos -->
          <div class="charts-grid">
            <div class="card chart-card">
              <h2 class="chart-card__title">Evolução do saldo</h2>
              <div id="chart-balance" class="chart-container">—</div>
            </div>
            <div class="card chart-card">
              <h2 class="chart-card__title">Gastos por categoria</h2>
              <div id="chart-category" class="chart-container">—</div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Modal de edição de transação -->
    <div class="modal-overlay" id="edit-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal__header">
          <h2 class="modal__title" id="edit-modal-title">Editar lançamento</h2>
          <button type="button" class="modal__close" id="edit-modal-close" aria-label="Fechar">×</button>
        </div>
        <form id="edit-form" novalidate>
          <div class="transaction-form__grid">
            <div class="field-group">
              <label for="edit-amount">Valor (R$)</label>
              <input type="number" id="edit-amount" step="0.01" min="0.01" required />
            </div>
            <div class="field-group">
              <label for="edit-date">Data</label>
              <input type="date" id="edit-date" required />
            </div>
            <div class="field-group">
              <label for="edit-type">Tipo</label>
              <select id="edit-type" required>
                <option value="income">Entrada</option>
                <option value="expense">Saída</option>
              </select>
            </div>
            <div class="field-group">
              <label for="edit-payment">Forma de pagamento</label>
              <select id="edit-payment">
                <option value="">Selecione...</option>
                <option value="debit">Débito</option>
                <option value="credit">Crédito</option>
                <option value="pix">PIX</option>
                <option value="cash">Dinheiro</option>
              </select>
            </div>
            <div class="field-group">
              <label for="edit-category">Categoria</label>
              <select id="edit-category">
                <option value="outros">Outros</option>
                <option value="alimentacao">Alimentação</option>
                <option value="moradia">Moradia</option>
                <option value="transporte">Transporte</option>
                <option value="lazer">Lazer</option>
                <option value="saude">Saúde</option>
                <option value="educacao">Educação</option>
                <option value="salario">Salário</option>
              </select>
            </div>
            <div class="field-group transaction-form__full">
              <label for="edit-description">Descrição</label>
              <input type="text" id="edit-description" required />
            </div>
          </div>
          <div class="feedback-message" id="edit-feedback"></div>
          <div class="modal__actions">
            <button type="button" class="btn-ghost" id="edit-cancel">Cancelar</button>
            <button type="submit" class="btn-submit" id="edit-save">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
