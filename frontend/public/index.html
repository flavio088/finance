<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINANCE — Login</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main>
      <div class="login-card">
        <h1 class="login-card__title">FINANCE</h1>
        <p class="login-card__subtitle">Entre na sua conta</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
            <span class="error-message" id="email-error">
              Informe um e-mail válido.
            </span>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <span class="error-message" id="password-error">
              Informe sua senha.
            </span>
          </div>

          <button type="submit" class="btn-primary-custom" id="login-btn">
            Entrar
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
